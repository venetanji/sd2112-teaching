name: Check Week 7 and AI news
on:
  pull_request:
    paths:
      - 'deck/*.py'
      - 'deck/assets/**'
      - 'tests/**'
      - 'lessons/week07-lesson-plan.md'
      - 'site/**'
      - 'deckgen.toml'
      - 'requirements.txt'
      - '.github/workflows/news-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check course content and Week 7 sequence
        run: python -m unittest discover -s tests -v
      - name: Build Week 7 HTML and PowerPoints and check overflow
        run: deckgen build week07 --no-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: week07-preview
          path: |
            _site/
            export/preview/
            export/week07*.pptx
            export/week07-activities.json
          retention-days: 7
