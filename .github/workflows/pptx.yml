name: Build PowerPoints

# On every push to main (or by hand): build the plain and the ClassPoint PowerPoints,
# the activity manifest, the .docx documents and the preview sheets, and keep them as
# a workflow artifact (Actions → this run → sd2112-powerpoints). Nothing is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Build PowerPoints, documents and previews
        run: python tools/build_all.py --pptx
      - uses: actions/upload-artifact@v4
        with:
          name: sd2112-powerpoints
          path: |
            export/*.pptx
            export/*.json
            export/docs/
            export/preview/*.jpg
          retention-days: 90
