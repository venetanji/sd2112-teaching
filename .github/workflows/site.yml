name: Publish site

# On every push to main (or by hand): build the html decks, print each one to a PDF
# without the ClassPoint buttons, build the syllabus page, and publish _site/ to
# GitHub Pages. Pages source must be "GitHub Actions" (Settings → Pages).
# The PowerPoints are built by the separate "Build PowerPoints" workflow.
#
# The site also carries the `staging` branch under /staging/, built with that branch's
# own toolchain pin, so a week can be checked in the browser before it reaches main.
# A finished "Build staging" run re-runs this workflow (workflow_run), still from main.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Build staging]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright Chromium (prints the PDFs)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the site (html decks, PDFs, syllabus)
        run: deckgen build --site
      - name: Is there a staging branch?
        id: staging
        run: |
          if git ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.staging.outputs.exists == 'true'
        with:
          ref: staging
          path: staging
      - name: Build the staging branch under /staging/ (a broken staging never blocks main)
        if: steps.staging.outputs.exists == 'true'
        continue-on-error: true
        run: |
          python -m venv staging/.venv
          staging/.venv/bin/pip install -q -r staging/requirements.txt
          (cd staging && NODE_PATH="$GITHUB_WORKSPACE/node_modules" .venv/bin/deckgen build --site)
          rm -rf _site/staging && cp -r staging/_site _site/staging
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
