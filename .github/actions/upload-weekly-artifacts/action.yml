name: Upload weekly slides
description: Add individual weekly downloads alongside the existing full bundle
inputs:
  prefix:
    description: Artifact prefix; the week name is appended
    required: true
  retention-days:
    description: Number of days to keep the weekly downloads
    required: true
  decks-file:
    description: Optional JSON file selecting the weeks built by this job
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare weekly downloads
      shell: bash
      env:
        WEEKLY_DECKS_FILE: ${{ inputs.decks-file }}
      run: python scripts/prepare_weekly_artifacts.py --output "$RUNNER_TEMP/weekly-slides" --decks-file "$WEEKLY_DECKS_FILE"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install the pinned Actions artifact client
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/weekly-artifact-client" --no-save --package-lock=false --no-audit --no-fund @actions/artifact@2.3.2
    - name: Upload each week's slides
      uses: actions/github-script@v7
      env:
        WEEKLY_ARTIFACT_PREFIX: ${{ inputs.prefix }}
        WEEKLY_RETENTION_DAYS: ${{ inputs.retention-days }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const {DefaultArtifactClient} = require(path.join(process.env.RUNNER_TEMP, 'weekly-artifact-client/node_modules/@actions/artifact'));
          const packages = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'weekly-slides/manifest.json'), 'utf8'));
          const client = new DefaultArtifactClient();
          core.summary.addHeading('Weekly slide downloads');
          for (const pkg of packages) {
            const name = `${process.env.WEEKLY_ARTIFACT_PREFIX}-${pkg.deck}`;
            const result = await client.uploadArtifact(name, pkg.files, pkg.root, {
              retentionDays: Number(process.env.WEEKLY_RETENTION_DAYS),
            });
            const url = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts/${result.id}`;
            core.summary.addLink(name, url).addBreak();
          }
          await core.summary.write();
